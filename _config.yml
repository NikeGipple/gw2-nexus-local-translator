# Aspetto delle pagine pubblicate con GitHub Pages
# (https://nikegipple.github.io/gw2-nexus-local-translator/).
# Su GitHub i file .md si vedono come sempre: questo file cambia solo il sito.
theme: jekyll-theme-cayman
title: GW2 Nexus Local Translator
# Nel sito servono solo le pagine (README, LEGGIMI, PRIVACY): il resto non va pubblicato qui.
# Il modulo scarica patch e glossari da GitHub, non da questo sito.
exclude:
  - patch
  - glossary
  - src
  - "Claude outputs"
  - LICENSE
# Testi della fascia in alto per le singole pagine (senza toccare i .md).
# Senza questo, sotto il titolo comparirebbe la descrizione inglese del repository.
defaults:
  - scope:
      path: "LEGGIMI.md"
    values:
      title: "Local Translator"
      description: "Traduzione offline in gioco per Guild Wars 2 - OPUS-MT + CTranslate2 - nessun servizio esterno, nessuna chiave API."
